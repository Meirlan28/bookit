[project]
name = "bookit"
version = "0.1.0"
description = "REST API сервиса бронирования переговорных комнат / рабочих мест в офисе."
readme = "README.md"
authors = [
    { name = "meirlan", email = "meirlan.aitmukamet@scity.pro" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.18.5",
    "asyncpg>=0.31.0",
    "fastapi[standard]>=0.141.1",
    "passlib>=1.7.4",
    "pyjwt>=2.13.0",
    "python-multipart>=0.0.32",
    "ruff>=0.16.1",
    "slowapi>=0.1.10",
    "sqladmin>=0.30.0",
    "sqlalchemy>=2.0.51",
    "uvicorn[standard]>=0.52.0",
]

[project.scripts]
bookit = "bookit:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"
